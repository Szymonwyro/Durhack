<!doctype html>
<!-- Desktop preview of the Quest skeleton renderer (quest/src/skeleton.js), no headset needed.
     Serve the repo root (e.g. python3 -m http.server 8002) and open /quest/skeleton_test.html
       default      plays samples/test_walk2_camA_pose.jsonl (recorded skeletons) on a loop
       ?live=1      uses ws://<this host>/tracks (run from the bridge: http://localhost:8001/quest/skeleton_test.html?live=1)
       ?frozen=1    shows the frozen style
     Drag = orbit. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>skeleton preview</title>
  <style>html, body { margin: 0; height: 100%; background: #101518; color: #cfe; font: 13px system-ui; } #hud { position: fixed; left: 10px; top: 8px; }</style>
  <script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js?v=0.187.0" } }</script>
</head>
<body>
<div id="hud">loading…</div>
<script type="module">
  import * as THREE from 'three';
  import { SkeletonView } from './src/skeleton.js';

  const q = new URLSearchParams(location.search);
  const hud = document.getElementById('hud');
  window.onerror = (m) => { hud.textContent = 'ERROR: ' + m; document.title = 'ERROR ' + m; };
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 50);
  const grid = new THREE.GridHelper(4, 8, 0x335, 0x223);
  scene.add(grid);
  const root = new THREE.Group();   // stands in for a track's root group (at the person's foot)
  scene.add(root);
  const view = new SkeletonView();
  root.add(view.object);
  let az = 0.9, el = 0.25, dragging = false;
  addEventListener('pointerdown', () => { dragging = true; });
  addEventListener('pointerup', () => { dragging = false; });
  addEventListener('pointermove', (e) => { if (dragging) { az -= e.movementX * 0.01; el = Math.min(1.2, Math.max(-0.1, el + e.movementY * 0.01)); } });
  function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();

  let msg = null, frames = [], fi = 0, lastStep = 0;
  if (q.get('live') === '1') {
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/tracks`);
    ws.onmessage = (e) => { const m = JSON.parse(e.data); const t = (m.tracks || []).find((x) => x.skeleton); if (t) msg = t; };
  } else {
    const text = await (await fetch('../samples/test_walk2_camA_pose.jsonl')).text();
    frames = text.split('\n').filter(Boolean).map((l) => JSON.parse(l)).filter((r) => r.kp3d)
      .map((r) => ({ id: 1, pos: r.foot, skeleton: { kp: r.kp3d, src: r.cam, age: 0, frozen: q.get('frozen') === '1' } }));
  }
  let last = performance.now();
  renderer.setAnimationLoop((now) => {
    const dt = (now - last) / 1000; last = now;
    if (frames.length && now - lastStep > 33) { msg = frames[fi = (fi + 1) % frames.length]; lastStep = now; }
    const target = new THREE.Vector3(0, 0.9, 0);
    camera.position.set(target.x + 3.2 * Math.cos(el) * Math.sin(az), target.y + 3.2 * Math.sin(el), target.z + 3.2 * Math.cos(el) * Math.cos(az));
    camera.lookAt(target);
    if (msg) {
      const head = camera.position;   // the "wearer" is the preview camera
      const shown = view.update(msg, dt, 1, 0x00e5ff, false, { x: head.x, z: head.z });
      const n = msg.skeleton.kp.filter(Boolean).length;
      hud.textContent = `${shown ? 'skeleton shown' : 'no skeleton'} · ${n}/17 joints · src ${msg.skeleton.src}` +
        `${msg.skeleton.frozen ? ' · frozen' : ''} · top ${view.top.toFixed(2)} m` + (frames.length ? ` · frame ${fi}/${frames.length}` : ' · live');
      document.title = shown ? `OK ${n} joints` : 'no skeleton';
    }
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
