<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DurHack live camera map</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101518; color: #e8eeee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem 1.4rem; border-bottom: 1px solid #303a3e; }
    h1 { margin: 0; font-size: 1.2rem; }
    #connection { font-size: .9rem; color: #f1bd61; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 38%); gap: 1rem; padding: 1rem; }
    section { min-width: 0; }
    h2 { margin: 0 0 .65rem; font-size: 1rem; color: #c3d0d2; }
    #map { width: 100%; height: min(72vh, 760px); min-height: 420px; display: block; border: 1px solid #344044; background: #192124; }
    #feeds { display: grid; gap: .8rem; }
    article { border: 1px solid #344044; background: #192124; }
    article header { padding: .5rem .7rem; }
    article img { display: block; width: 100%; min-height: 130px; object-fit: contain; background: #080b0c; }
    .camera-status { color: #f1bd61; font-size: .8rem; }
    #tracks { padding: .7rem; color: #aebbbc; font-size: .85rem; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      #map { height: 55vh; min-height: 340px; }
      #feeds { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <h1>DurHack · shared live camera map</h1>
    <label style="font-size:.9rem"><input type="checkbox" id="showSkeletons" checked> Skeletons</label>
    <span id="connection">Connecting to fusion server…</span>
  </header>
  <main>
    <section>
      <h2>Floor positions · metres</h2>
      <canvas id="map" aria-label="Top-down live map"></canvas>
      <div id="tracks">Waiting for camera detections…</div>
    </section>
    <section>
      <h2>Camera feeds</h2>
      <div id="feeds"></div>
    </section>
  </main>
  <script>
    const canvas = document.getElementById("map");
    const context = canvas.getContext("2d");
    const connection = document.getElementById("connection");
    const feeds = document.getElementById("feeds");
    const tracksLabel = document.getElementById("tracks");
    let world = {bounds: [-0.5, 2, -0.5, 2], walls: [], cameras: []};
    let tracks = [];
    // COCO-17 bones (docs/CONTRACTS.md)
    const STATE_COLOURS = {TRUSTED: "#3ccf5a", DEGRADED: "#f1bd3b", EXCLUDED: "#ff8a2a", OFFLINE: "#7d8486"};
    const BONES = [[5,7],[7,9],[6,8],[8,10],[5,6],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16],[0,5],[0,6]];
    const showSkeletons = document.getElementById("showSkeletons");
    try { showSkeletons.checked = localStorage.getItem("showSkeletons") !== "0"; } catch (e) {}
    showSkeletons.addEventListener("change", () => {
      try { localStorage.setItem("showSkeletons", showSkeletons.checked ? "1" : "0"); } catch (e) {}
      draw();
    });

    function setupFeeds(cameras) {
      feeds.replaceChildren();
      for (const camera of cameras) {
        const card = document.createElement("article");
        const bar = document.createElement("header");
        const title = document.createElement("strong");
        title.textContent = camera.id;
        const status = document.createElement("span");
        status.className = "camera-status";
        status.dataset.camStatus = camera.id;
        status.textContent = "Waiting for worker";
        bar.append(title, status);
        const image = document.createElement("img");
        image.alt = `Annotated live feed from ${camera.id}`;
        // unique URL per (re)connect: with the same URL browsers keep showing the cached last frame after a
        // server restart (feed looks frozen while tracks still update)
        image.src = `/camera/${encodeURIComponent(camera.id)}.mjpg?t=${Date.now()}`;
        image.onerror = () => { status.textContent = "No feed"; };
        image.onload = () => { if (!camera.state) status.textContent = "Live"; };
        card.append(bar, image);
        feeds.append(card);
      }
    }

    function draw() {
      const ratio = window.devicePixelRatio || 1;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (!width || !height) return;
      if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
      }
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, width, height);
      context.fillStyle = "#192124";
      context.fillRect(0, 0, width, height);

      const [xmin, xmax, ymin, ymax] = world.bounds;
      const pad = 42;
      const scale = Math.min((width - 2 * pad) / (xmax - xmin), (height - 2 * pad) / (ymax - ymin));
      const mapWidth = (xmax - xmin) * scale;
      const mapHeight = (ymax - ymin) * scale;
      const left = (width - mapWidth) / 2;
      const bottom = (height + mapHeight) / 2;
      const point = ([x, y]) => [left + (x - xmin) * scale, bottom - (y - ymin) * scale];

      context.strokeStyle = "#303a3e";
      context.lineWidth = 1;
      for (let x = Math.ceil(xmin); x <= xmax; x += 1) {
        const [px] = point([x, ymin]);
        context.beginPath(); context.moveTo(px, bottom - mapHeight); context.lineTo(px, bottom); context.stroke();
        context.fillStyle = "#96a2a4"; context.fillText(`${x}m`, px + 3, bottom + 16);
      }
      for (let y = Math.ceil(ymin); y <= ymax; y += 1) {
        const [, py] = point([xmin, y]);
        context.beginPath(); context.moveTo(left, py); context.lineTo(left + mapWidth, py); context.stroke();
        context.fillStyle = "#96a2a4"; context.fillText(`${y}m`, left - 32, py - 4);
      }
      context.strokeStyle = "#758184";
      context.lineWidth = 5;
      for (const wall of world.walls) {
        const a = point(wall.a), b = point(wall.b);
        context.beginPath(); context.moveTo(...a); context.lineTo(...b); context.stroke();
      }
      context.strokeStyle = "#718184";
      context.lineWidth = 1;
      context.strokeRect(left, bottom - mapHeight, mapWidth, mapHeight);
      // cameras: field-of-view wedge coloured by state (TRUSTED green, DEGRADED amber, EXCLUDED orange, OFFLINE grey)
      for (const cam of world.cameras || []) {
        if (!cam.pos) continue;
        const colour = STATE_COLOURS[cam.state] || STATE_COLOURS.OFFLINE;
        const [cx, cy] = point(cam.pos);
        const yaw = (cam.yaw || 0) * Math.PI / 180, half = (cam.fov || 60) * Math.PI / 360, reach = 1.2 * scale;
        context.beginPath(); context.moveTo(cx, cy);
        context.arc(cx, cy, reach, -yaw - half, -yaw + half);  // canvas y is down: world angle -> -angle
        context.closePath();
        context.fillStyle = colour + "33"; context.fill();
        context.strokeStyle = colour; context.lineWidth = 2; context.stroke();
        context.beginPath(); context.arc(cx, cy, 6, 0, Math.PI * 2); context.fillStyle = colour; context.fill();
        const extra = [cam.weight != null ? `w ${(+cam.weight).toFixed(1)}` : "", cam.fps != null ? `${cam.fps} fps` : "",
                       cam.lag_ms != null ? `${cam.lag_ms} ms` : ""].filter(Boolean).join(" · ");
        context.fillStyle = colour; context.font = "bold 13px system-ui";
        context.fillText(`${cam.id} ${cam.state || ""}`, cx + 10, cy + 18);
        context.font = "12px system-ui"; context.fillStyle = "#c9d4d5";
        if (extra) context.fillText(extra, cx + 10, cy + 33);
      }

      tracks.forEach((track, index) => {
        if (showSkeletons.checked && track.skeleton) {  // top-down: bones as thin lines (x, y only)
          const kp = track.skeleton.kp;
          context.strokeStyle = track.skeleton.frozen ? "rgba(255,170,60,0.55)" : "rgba(90,230,255,0.9)";
          context.lineWidth = 1.5;
          context.setLineDash(track.skeleton.frozen ? [4, 3] : []);
          for (const [a, b] of BONES) {
            if (!kp[a] || !kp[b]) continue;
            context.beginPath(); context.moveTo(...point(kp[a])); context.lineTo(...point(kp[b])); context.stroke();
          }
          context.setLineDash([]);
        }
        const [x, y] = point(track.pos);
        const color = `hsl(${(track.class_id * 71 + 175) % 360} 90% 62%)`;
        context.beginPath(); context.arc(x, y, 8, 0, Math.PI * 2);
        context.fillStyle = color; context.fill();
        context.strokeStyle = "#f4ffff"; context.lineWidth = 1.5; context.stroke();
        const cameras = (track.seen_by || []).join(",");
        context.fillStyle = "#eef5f5";
        context.font = "13px system-ui";
        const label = track.id < 100000 ? `#${track.id} ${track.state || ""}` : track.class_name;
        context.fillText(`${label} ${track.pos[0].toFixed(2)}, ${track.pos[1].toFixed(2)}m · ${cameras}`, x + 12, y - 10);
      });
      tracksLabel.textContent = tracks.length
        ? `${tracks.length} track${tracks.length === 1 ? "" : "s"} · people tracked (Kalman, stable ids), other objects grouped per frame`
        : "No recent detections";
    }

    async function start() {
      try {
        const response = await fetch("/api/world");
        if (!response.ok) throw new Error(`world config returned ${response.status}`);
        world = await response.json();
        setupFeeds(world.cameras);
        draw();
        const scheme = location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(`${scheme}//${location.host}/tracks`);
        socket.onopen = () => { connection.textContent = "Connected"; connection.style.color = "#85dc9a"; };
        socket.onmessage = event => {
          const message = JSON.parse(event.data);
          tracks = message.tracks || [];
          if (message.cameras) {  // every 1 s: state, weight, fps, lag, pose per camera
            world.cameras = message.cameras;
            for (const cam of message.cameras) {
              const label = document.querySelector(`[data-cam-status="${CSS.escape(cam.id)}"]`);
              if (label) {
                label.textContent = `${cam.state} · w ${(+cam.weight || 0).toFixed(1)}` +
                  (cam.fps != null ? ` · ${cam.fps} fps · ${cam.lag_ms} ms` : "");
                label.style.color = STATE_COLOURS[cam.state] || STATE_COLOURS.OFFLINE;
              }
            }
          }
          draw();
        };
        socket.onclose = () => { connection.textContent = "Disconnected · reconnecting…"; connection.style.color = "#f1bd61"; setTimeout(start, 1500); };
        socket.onerror = () => socket.close();
      } catch (error) {
        connection.textContent = `Server error: ${error.message}`;
        connection.style.color = "#ff8585";
        setTimeout(start, 2000);
      }
    }
    window.addEventListener("resize", draw);
    start();
  </script>
</body>
</html>
